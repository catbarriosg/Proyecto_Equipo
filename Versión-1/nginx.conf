server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # YouTube necesita recibir el origen de la pagina (Referer) para
    # reproducir videos embebidos; sin esto aparece el "Error 153".
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
