server.port=${PORT:8090}

spring.application.name=ms-auth

spring.datasource.url=jdbc:mysql://mysql:3306/db_smarthealth_auth?createDatabaseIfNotExist=true
spring.datasource.username=smarthealth_user
spring.datasource.password=smarthealth_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.forward-headers-strategy=framework

feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=5000

# Debe ser la misma clave que usa ms-gateway (variable de entorno JWT_SECRET, mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:clinica-agenda-medica-clave-de-desarrollo-cambiar-en-produccion}
jwt.expiracion-horas=8
