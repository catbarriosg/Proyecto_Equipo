server.port=${PORT:8083}

spring.application.name=ms-hospitales

spring.datasource.url=jdbc:mysql://mysql:3306/db_smarthealth_hospitales?createDatabaseIfNotExist=true
spring.datasource.username=smarthealth_user
spring.datasource.password=smarthealth_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logs en DEBUG para el service (importante para la evaluación)
logging.level.com.SmartHealth.ms_hospitales=DEBUG
