server.port=${PORT:8082}

spring.application.name=ms-camas

spring.datasource.url=jdbc:mysql://mysql:3306/db_smarthealth_camas?createDatabaseIfNotExist=true
spring.datasource.username=smarthealth_user
spring.datasource.password=smarthealth_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logs en DEBUG para el service 
logging.level.com.SmartHealth.ms_camas=DEBUG

# Configuración de Feign Clients con timeout
# Timeout de conexión: 2 segundos
# Timeout de lectura: 5 segundos
feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=5000
feign.client.config.ms-hospitales.connectTimeout=2000
feign.client.config.ms-hospitales.readTimeout=5000
