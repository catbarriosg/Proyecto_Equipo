# ====================================================================
# BACKEND - Clínica Agenda Médica (microservicios SmartHealth)
# ====================================================================
# Levanta MySQL, Eureka, el gateway y los microservicios.
# Para levantar también el frontend, usa el docker-compose.yml de la raíz del proyecto.
#
# Solo el gateway (8080) queda expuesto: el frontend nunca llama directo a un microservicio.
# Si cambias init-scripts, recrea la base con:  docker compose down -v

# Opciones de la JVM para que todos los servicios quepan en poca memoria (Docker Desktop con 2-4 GB)
x-jvm-liviana: &jvm-liviana "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -Xms32m -Xmx192m -XX:ReservedCodeCacheSize=48m"

# Variables comunes a todos los microservicios
x-entorno-base: &entorno-base
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-discovery-server:8761/eureka/
  # Registra la IP del contenedor en Eureka (el nombre de host del contenedor no es resoluble)
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SPRING_DATASOURCE_USERNAME: smarthealth_user
  SPRING_DATASOURCE_PASSWORD: smarthealth_pass
  TZ: America/Santiago
  JAVA_TOOL_OPTIONS: *jvm-liviana

x-microservicio: &microservicio
  depends_on:
    mysql:
      condition: service_healthy
    ms-discovery-server:
      condition: service_healthy
  networks:
    - smarthealth-network
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ Base de datos
  mysql:
    image: mysql:8.0
    container_name: smarthealth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: smarthealth_db
      MYSQL_USER: smarthealth_user
      MYSQL_PASSWORD: smarthealth_pass
      TZ: America/Santiago
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d  # Scripts SQL ejecutados al crear el volumen
    healthcheck:
      # Por TCP: durante la carga inicial MySQL no acepta conexiones de red, así se espera a que termine
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smarthealth-network

  # ------------------------------------------------------------------ Registro de servicios
  ms-discovery-server:
    build: ./ms-discovery-server
    container_name: ms-discovery-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      JAVA_TOOL_OPTIONS: *jvm-liviana
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    healthcheck:
      # Con todos los servicios arrancando a la vez, una JVM puede tardar más de 2 minutos en iniciar
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 240s
    networks:
      - smarthealth-network
    restart: unless-stopped

  # ------------------------------------------------------------------ Puerta de entrada
  ms-gateway:
    build: ./ms-gateway
    container_name: ms-gateway
    ports:
      - "8080:8080"
    depends_on:
      ms-discovery-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: *jvm-liviana
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET:-clinica-agenda-medica-clave-de-desarrollo-cambiar-en-produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 240s
    networks:
      - smarthealth-network
    restart: unless-stopped

  # ------------------------------------------------------------------ Servicios de la clínica
  ms-auth:
    <<: *microservicio
    build: ./ms-auth
    container_name: ms-auth
    environment:
      <<: *entorno-base
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_auth
      JWT_SECRET: ${JWT_SECRET:-clinica-agenda-medica-clave-de-desarrollo-cambiar-en-produccion}

  ms-citas:
    <<: *microservicio
    build: ./ms-citas
    container_name: ms-citas
    environment:
      <<: *entorno-base
      SERVER_PORT: 8091
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_citas

  ms-pacientes:
    <<: *microservicio
    build: ./ms-pacientes
    container_name: ms-pacientes
    environment:
      <<: *entorno-base
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_pacientes

  ms-personal:
    <<: *microservicio
    build: ./ms-personal
    container_name: ms-personal
    environment:
      <<: *entorno-base
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_personal

  ms-hospitales:
    <<: *microservicio
    build: ./ms-hospitales
    container_name: ms-hospitales
    environment:
      <<: *entorno-base
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_hospitales

  ms-historial:
    <<: *microservicio
    build: ./ms-historial
    container_name: ms-historial
    environment:
      <<: *entorno-base
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_historial

  # ------------------------------------------------------------------ Servicios internos (sin vistas en el frontend)
  # No se levantan por defecto para ahorrar memoria. Para incluirlos: docker compose --profile internos up
  ms-camas:
    <<: *microservicio
    profiles: ["internos"]
    build: ./ms-camas
    container_name: ms-camas
    environment:
      <<: *entorno-base
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_camas

  ms-equipamiento:
    <<: *microservicio
    profiles: ["internos"]
    build: ./ms-equipamiento
    container_name: ms-equipamiento
    environment:
      <<: *entorno-base
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_equipamiento

  ms-insumos:
    <<: *microservicio
    profiles: ["internos"]
    build: ./ms-insumos
    container_name: ms-insumos
    environment:
      <<: *entorno-base
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_insumos

  ms-listas-de-espera:
    <<: *microservicio
    profiles: ["internos"]
    build: ./ms-listas-de-espera
    container_name: ms-listas-de-espera
    environment:
      <<: *entorno-base
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_listas_de_espera

  ms-triaje:
    <<: *microservicio
    profiles: ["internos"]
    build: ./ms-triaje
    container_name: ms-triaje
    environment:
      <<: *entorno-base
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_smarthealth_triaje

networks:
  smarthealth-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
