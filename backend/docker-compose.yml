# ====================================
# DOCKER COMPOSE - SmartHealth Completo
# ====================================
# Levanta: 11 microservicios + MySQL + Eureka

version: '3.9'

services:
  # ====================================
  # DATABASE - MySQL 8.0
  # ====================================
  mysql:
    image: mysql:8.0
    container_name: smarthealth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: smarthealth_db
      MYSQL_USER: smarthealth_user
      MYSQL_PASSWORD: smarthealth_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d  # Scripts SQL ejecutados automáticamente al iniciar
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthealth-network

  # ====================================
  # EUREKA SERVICE REGISTRY
  # ====================================
  ms-discovery-server:
    build:
      context: ./ms-discovery-server
      dockerfile: Dockerfile
    container_name: ms-discovery-8761
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - smarthealth-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ====================================
  # API GATEWAY
  # ====================================
  ms-gateway:
    build:
      context: ./ms-gateway
      dockerfile: Dockerfile
    container_name: ms-gateway-8080
    ports:
      - "8080:8080"
    depends_on:
      ms-discovery-server:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_NAME=ms-gateway
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://ms-discovery-server:8761/eureka/
    networks:
      - smarthealth-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ====================================
  # MICROSERVICIO: PACIENTES (8081)
  # ====================================
  ms-pacientes:
    build:
      context: ./ms-pacientes
      dockerfile: Dockerfile
    container_name: ms-pacientes-8081
    depends_on:
      mysql:
        condition: service_healthy
      ms-discovery-server:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - SPRING_APPLICATION_NAME=ms-pacientes
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/db_smarthealth_pacientes
      - SPRING_DATASOURCE_USERNAME=smarthealth_user
      - SPRING_DATASOURCE_PASSWORD=smarthealth_pass
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://ms-discovery-server:8761/eureka/
    networks:
      - smarthealth-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ====================================
  # MICROSERVICIO: CAMAS (8082)
