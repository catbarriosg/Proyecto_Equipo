# Configuración para las pruebas: reemplaza a src/main/resources/application.properties
# Usa una base H2 en memoria (modo MySQL), así las pruebas no necesitan MySQL, Eureka ni otros servicios.

spring.application.name=ms-citas

spring.datasource.url=jdbc:h2:mem:db_smarthealth_citas;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# El esquema se crea desde las entidades al iniciar cada contexto de prueba y se borra al terminar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Sin registro en Eureka durante las pruebas
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=5000

# Zona horaria de la clínica para calcular horarios disponibles y la regla de 24 horas
clinica.zona-horaria=America/Santiago
