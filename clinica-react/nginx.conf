server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # YouTube necesita recibir el origen de la página (Referer) para reproducir videos embebidos
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS interno de Docker: el nombre del gateway se vuelve a resolver si el contenedor se recrea
    resolver 127.0.0.11 valid=10s ipv6=off;

    # La API se atiende desde el mismo origen: nginx la reenvía al gateway y no hay problemas de CORS
    location /api/ {
        set $gateway http://ms-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: cualquier ruta que no sea un archivo devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
